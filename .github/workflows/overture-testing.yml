name: Rebuild Overture testing image
on:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request testing build with this exact commit
        env:
          GH_TOKEN: ${{ secrets.OVERTURE_DISPATCH_TOKEN }}
        run: |
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            '{event_type: "module-push", client_payload: {repository: $repository, sha: $sha}}' \
            | gh api --method POST repos/eukhlg/overture-vpn/dispatches --input -
